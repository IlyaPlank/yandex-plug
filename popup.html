<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Настройки плагина</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h3>Настройки</h3>
      </header>

      <div class="settings-list">
        <div class="settings-item">
          <div class="setting-group">
            <label class="switch-item">
              <span>Ограничить ширину</span>
              <input type="checkbox" id="maxWidth" />
              <span class="slider"></span>
            </label>

            <div
              id="widthInputContainer"
              class="sub-setting"
              style="display: none"
            >
              <input
                type="number"
                id="maxWidthValue"
                value="1920"
                min="800"
                max="5000"
              />
              <span>пикселей (px)</span>
            </div>
          </div>
        </div>

        <div class="settings-item">
          <label class="switch-item">
            <span>Скрыть волну</span>
            <input type="checkbox" id="hideAnimationWave" />
            <span class="slider"></span>
          </label>
        </div>
        <!-- <div class="settings-item">
          <label class="switch-item">
            <span>Чистая главная</span>
            <input type="checkbox" id="cleanMainPage" />
            <span class="slider"></span>
          </label>
        </div> -->
        <div class="settings-item">
          <label class="switch-item">
            <span>Скрыть "Установить приложение"</span>
            <input type="checkbox" id="hideInstallApp" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="settings-item">
          <label class="switch-item">
            <span>Скрыть ИИ</span>
            <input type="checkbox" id="hideAI" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="settings-item">
          <div class="shortcut">
            <kbd>Ctrl</kbd>
            <span class="plus">+</span>
            <kbd>C</kbd>
            <span> - Копировать трек</span>
          </div>
        </div>
        <div class="settings-item">
          <div class="shortcut">
            <kbd>Space</kbd>
            <span> - Play/Pause</span>
          </div>
        </div>
        <!-- <div class="settings-item"></div> -->

        <!-- <label class="switch-item">
          <span>Обложка на фоне</span>
          <input type="checkbox" id="backgroundImage" />
          <span class="slider"></span>
        </label> -->
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
