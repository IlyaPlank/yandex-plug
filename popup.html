<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Настройки плагина</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h2>Настройки</h2>
    <label> <input type="checkbox" id="maxWidth" /> Максимальная ширина </label
    ><br />
    <label>
      <input type="checkbox" id="hideAnimationWave" />
      Скрыть анимацию волны </label
    ><br />
    <label>
      <input type="checkbox" id="cleanMainPage" /> Сдвинуть элементы предложки
      вниз
    </label>
    <br />
    <label>
      <input type="checkbox" id="hideInstallApp" /> Скрыть блок с установкой
      приложения
    </label>

    <script src="popup.js"></script>
  </body>
</html>
